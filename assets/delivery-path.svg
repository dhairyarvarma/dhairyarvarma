<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Inside a delivery</title>
  <desc id="desc">A conceptual animated architecture diagram, not live telemetry. The API writes an event and outbox record to PostgreSQL. An outbox relay publishes to Redis Streams, workers send to a receiver, and results return to PostgreSQL.</desc>
  <rect width="1200" height="300" rx="12" fill="#141517"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="32" y="38" fill="#a78bfa" font-size="12" letter-spacing="2">INSIDE A DELIVERY</text>
    <text x="1168" y="38" text-anchor="end" fill="#9b9da3" font-size="12">CONCEPTUAL FLOW / NOT LIVE TELEMETRY</text>
    <g fill="none" stroke="#50515a" stroke-width="2">
      <path d="M173 123H230M403 123H457M603 123H655M801 123H853M999 123H1051"/>
      <path d="M926 162V222H316V162" stroke-dasharray="5 6"/>
    </g>
    <g fill="#1d1e22" stroke="#393b41">
      <rect x="32" y="84" width="141" height="78" rx="8"/>
      <rect x="230" y="84" width="173" height="78" rx="8" stroke="#8b5cf6"/>
      <rect x="457" y="84" width="146" height="78" rx="8"/>
      <rect x="655" y="84" width="146" height="78" rx="8"/>
      <rect x="853" y="84" width="146" height="78" rx="8"/>
      <rect x="1051" y="84" width="117" height="78" rx="8"/>
    </g>
    <g fill="#ededf0" font-size="17" text-anchor="middle">
      <text x="102" y="117">API</text><text x="316" y="117">PostgreSQL</text><text x="530" y="117">Outbox relay</text><text x="728" y="117">Redis Streams</text><text x="926" y="117">Workers</text><text x="1109" y="117">Receiver</text>
    </g>
    <g fill="#9b9da3" font-size="12" text-anchor="middle">
      <text x="102" y="140">accept event</text><text x="316" y="140">event + outbox</text><text x="530" y="140">publish work</text><text x="728" y="140">transport</text><text x="926" y="140">deliver + retry</text><text x="1109" y="140">HTTP target</text>
    </g>
    <text x="620" y="247" fill="#9b9da3" font-size="13" text-anchor="middle">persist attempt + delivery state</text>
    <text x="32" y="278" fill="#9b9da3" font-size="12">Durability lives in PostgreSQL. Transport lives in Redis. Recovery is explicit.</text>
  </g>
  <g fill="#a78bfa">
    <path d="M224 119L230 123L224 127ZM451 119L457 123L451 127ZM649 119L655 123L649 127ZM847 119L853 123L847 127ZM1045 119L1051 123L1045 127Z"/>
    <circle r="4"><animateMotion path="M173 123H230" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M403 123H457" dur="2.4s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M603 123H655" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M801 123H853" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="4"><animateMotion path="M999 123H1051" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
