<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dhairya Varma — Full Stack Developer</title>
  <desc id="desc">A purple night skyline with an original pixel art Spider-Man swinging from a web above a comic style developer title.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#0a0914"/><stop offset="1" stop-color="#1d1234"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2" height="2" fill="#a78bfa" opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="16" fill="url(#night)"/>
  <rect width="1200" height="420" rx="16" fill="url(#dots)"/>
  <path d="M0 32H1200M0 388H1200" stroke="#73519a" opacity=".45"/>
  <g fill="#c4b5fd" opacity=".65">
    <rect x="730" y="61" width="5" height="5"/><rect x="805" y="108" width="6" height="6"/><rect x="1135" y="57" width="5" height="5"/>
    <rect x="1076" y="164" width="5" height="5"/><rect x="854" y="31" width="4" height="4"/><rect x="1160" y="248" width="4" height="4"/>
  </g>
  <g fill="#20172f">
    <path d="M0 310H72V257H94V293H145V222H172V290H226V243H250V306H291V264H344V293H414V235H455V310H499V268H536V320H610V284H652V340H0Z"/>
    <path d="M676 335V267H703V230H749V288H780V246H819V314H850V209H886V288H908V269H953V320H983V235H1035V287H1077V253H1114V307H1160V273H1200V420H676Z"/>
  </g>
  <g fill="#6d4f91" opacity=".55">
    <rect x="160" y="248" width="7" height="9"/><rect x="210" y="304" width="7" height="9"/><rect x="429" y="257" width="7" height="9"/>
    <rect x="717" y="245" width="7" height="9"/><rect x="866" y="229" width="7" height="9"/><rect x="1005" y="256" width="7" height="9"/>
    <rect x="1112" y="324" width="7" height="9"/><rect x="1145" y="324" width="7" height="9"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="64" y="71" fill="#ad96cb" font-size="17" font-weight="700" letter-spacing="4">DHAIRYARVARMA.DEV  /  ISSUE 01</text>
    <text x="59" y="166" fill="#f6f3ff" font-size="70" font-weight="900" letter-spacing="-3">BUILD THE</text>
    <text x="59" y="246" fill="#f6f3ff" font-size="70" font-weight="900" letter-spacing="-3">WHOLE THING<tspan fill="#b28cff">.</tspan></text>
    <rect x="63" y="279" width="324" height="38" rx="4" fill="#8254b8"/>
    <text x="78" y="305" fill="#fff" font-size="18" font-weight="700" letter-spacing="2">FULL STACK DEVELOPER</text>
    <text x="64" y="368" fill="#d6c8e6" font-size="18">Currently building: RepoScope</text>
    <text x="1138" y="368" fill="#c7aedf" font-size="12" text-anchor="end" letter-spacing="2">SWINGING BETWEEN IDEAS &amp; IMPLEMENTATION</text>
  </g>
  <g class="swing">
    <animateTransform attributeName="transform" type="rotate" values="-7 974 0;7 974 0;-7 974 0" dur="4.5s" repeatCount="indefinite"/>
    <path d="M974 0V130" stroke="#e9e6f7" stroke-width="3" stroke-dasharray="6 2"/>
    <g shape-rendering="crispEdges">
      <!-- Mask, white lenses, and a small black web lattice. -->
      <rect x="946" y="129" width="56" height="12" fill="#e94c5d"/>
      <rect x="934" y="141" width="80" height="48" fill="#e94c5d"/>
      <rect x="946" y="189" width="56" height="12" fill="#e94c5d"/>
      <rect x="946" y="153" width="20" height="12" fill="#fcfaff"/>
      <rect x="982" y="153" width="20" height="12" fill="#fcfaff"/>
      <path d="M974 141V189M946 141L962 153M1002 141L986 153M946 177L962 165M1002 177L986 165M934 165H1014" stroke="#202332" stroke-width="3"/>
      <rect x="946" y="201" width="56" height="54" fill="#e94c5d"/>
      <rect x="946" y="237" width="12" height="18" fill="#2b5f9d"/>
      <rect x="990" y="237" width="12" height="18" fill="#2b5f9d"/>
      <path d="M974 206V249M954 218H994M958 230H990" stroke="#202332" stroke-width="3"/>
      <!-- One raised arm grips the web; the other reaches toward the skyline. -->
      <rect x="994" y="201" width="16" height="14" fill="#2b5f9d"/>
      <rect x="1007" y="178" width="14" height="35" fill="#e94c5d"/>
      <rect x="1007" y="131" width="14" height="50" fill="#e94c5d"/>
      <rect x="1004" y="121" width="20" height="13" fill="#e94c5d"/>
      <rect x="927" y="209" width="20" height="14" fill="#2b5f9d"/>
      <rect x="901" y="215" width="29" height="13" fill="#e94c5d"/>
      <rect x="890" y="215" width="14" height="18" fill="#e94c5d"/>
      <!-- Bent blue legs and red boots read clearly at README size. -->
      <rect x="950" y="255" width="20" height="35" fill="#2b5f9d"/>
      <rect x="930" y="280" width="32" height="16" fill="#2b5f9d"/>
      <rect x="915" y="290" width="29" height="13" fill="#e94c5d"/>
      <rect x="980" y="255" width="20" height="35" fill="#2b5f9d"/>
      <rect x="997" y="280" width="34" height="16" fill="#2b5f9d"/>
      <rect x="1025" y="288" width="28" height="13" fill="#e94c5d"/>
    </g>
  </g>
</svg>
